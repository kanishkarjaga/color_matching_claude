name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: thread_app/thread_app/app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter create . --project-name thread_recommender --platforms=android --org com.workshop
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: thread-recommender-apk
          path: thread_app/thread_app/app/build/app/outputs/flutter-apk/app-release.apk
